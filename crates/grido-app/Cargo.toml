[package]
name = "grido-app"
version = "0.1.0"
edition = "2024"
authors = ["Eduard Moldovan"]
description = "Grido's roles: the window, the MCP server with its bridge onto the window, and the confirmation dialog"

[[bin]]
name = "grido"
path = "src/main.rs"

[dependencies]
eframe = "0.33.3"
omarchy-kit = { git = "https://github.com/edimoldovan/omarchy-kit.git", rev = "57c1c54ffff8c1c721ee094a91fb9e16a70ed2ec" }
grido = { path = "../grido" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"
