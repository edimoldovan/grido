[package]
name = "grido-app"
version = "0.1.0"
edition = "2024"
authors = ["Eduard Moldovan"]
description = "Grido's roles: the window, the MCP server with its bridge onto the window, and the confirmation dialog"

[[bin]]
name = "grido"
path = "src/main.rs"

[dependencies]
eframe = "0.33.3"
omarchy-kit = { git = "https://github.com/edimoldovan/omarchy-kit.git", rev = "b2379200a60c1d3fb2ce429a70ce8cd1f365bc0e" }
grido = { path = "../grido" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"
